server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter owns the paths. Without this fallback, opening /accounts directly —
    # or reloading it — returns 404 from nginx instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the content-hashed bundle. Without this a browser applies
        # heuristic freshness (a tenth of the file's age) and keeps showing a build from
        # months ago; "no-cache" means "ask before reusing", which is a cheap 304.
        add_header Cache-Control "no-cache";
    }

    # Hashed file names: a new build asks for new names, so these never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
