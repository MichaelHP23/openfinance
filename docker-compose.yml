# ponytail: restart policy instead of a supervisor — Docker Desktop's "start on login"
# plus these three words is the whole "keep it running" story on a desktop box.
services:
  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_USER: openfinance
      POSTGRES_PASSWORD: openfinance
      POSTGRES_DB: openfinance
    # Loopback only. The spec says delete this, which is right for the instance but breaks
    # running the API on a host against the compose database (backend/.env.example points
    # DATABASE_URL at localhost). 127.0.0.1 is never reachable from the public IP, so it
    # meets the same goal on the VM while keeping the dev loop.
    ports: ["127.0.0.1:5433:5432"]
    command: postgres -c shared_buffers=768MB
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfinance"]
      interval: 5s
      retries: 10
  redis:
    restart: unless-stopped
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
  api:
    restart: unless-stopped
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # In-container hosts always win over whatever .env has for local dev.
      DATABASE_URL: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      REDIS_URL: redis://redis:6379/0
      # Single-user desktop install: no login. Only safe because this binds to localhost.
      LOCAL_MODE: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    # ponytail: ${VAR:?msg} makes compose refuse to start when TS_IP is unset, instead of
    # interpolating empty and publishing on 0.0.0.0. Fail closed — on a host with a public
    # IP the quiet fallback is an unauthenticated finance API on the internet.
    ports: ["${TS_IP:?TS_IP must be set — see .env.example}:8000:8000"]
    volumes: ["documents-data:/app/data/documents"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    restart: unless-stopped
    build: ./frontend
    # No VITE_API_URL: the client derives the API host from whatever address the page
    # was opened on, so localhost, a LAN IP and a Tailscale name all work unchanged.
    depends_on: [api]
    ports: ["${TS_IP:?TS_IP must be set — see .env.example}:5173:5173"]
    # Static build served by nginx. The frontend dev loop is `npm run dev` in ./frontend,
    # not this container — it serves the built bundle, so edits need a rebuild.
volumes:
  pgdata:
  documents-data:
