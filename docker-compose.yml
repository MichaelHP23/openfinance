services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: openfinance
      POSTGRES_PASSWORD: openfinance
      POSTGRES_DB: openfinance
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfinance"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # In-container hosts always win over whatever .env has for local dev.
      DATABASE_URL: postgresql+psycopg://openfinance:openfinance@postgres:5432/openfinance
      REDIS_URL: redis://redis:6379/0
      # Single-user desktop install: no login. Only safe because this binds to localhost.
      LOCAL_MODE: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: ./frontend
    environment:
      # Browser-side URL, so it's the host mapping — not the compose service name.
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["5173:5173"]
    # Live source, so editing a file reloads the browser instead of needing a rebuild.
    # The anonymous volume keeps the image's node_modules (Linux binaries) in place.
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  pgdata:
